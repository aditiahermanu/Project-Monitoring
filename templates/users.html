{% extends 'base.html' %}{% block content %}<h3>User Management</h3><div class="row g-4"><div class="col-md-5"><div class="card p-4"><form method="post"><input name="name" class="form-control mb-2" placeholder="Name"><input name="username" class="form-control mb-2" placeholder="Username"><input name="password" type="password" class="form-control mb-2" placeholder="Password"><select name="role" class="form-select mb-3"><option value="project_user">Project User</option><option value="executor">Project Executor</option><option value="admin">Admin</option></select><button class="btn btn-primary">Create User</button></form></div></div><div class="col-md-7"><div class="card p-4"><table class="table"><tr><th>Name</th><th>Username</th><th>Role</th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.username}}</td><td>{{u.role}}</td></tr>{% endfor %}</table></div></div></div>{% endblock %}
