{% extends 'base.html' %}{% block content %}<h3>New Project</h3><div class="card p-4"><form method="post"><div class="row g-3"><div class="col-md-3"><label>Code</label><input name="code" class="form-control" required></div><div class="col-md-9"><label>Name</label><input name="name" class="form-control" required></div><div class="col-md-4"><label>Manager</label><input name="manager" class="form-control"></div><div class="col-md-4"><label>Start</label><input name="start" type="date" class="form-control"></div><div class="col-md-4"><label>Target</label><input name="target" type="date" class="form-control"></div><div class="col-md-4"><label>Budget</label><input name="budget" type="number" class="form-control"></div><div class="col-md-4"><label>Planned %</label><input name="planned" type="number" min="0" max="100" class="form-control"></div><div class="col-md-4"><label>Actual %</label><input name="actual" type="number" min="0" max="100" class="form-control"></div><div class="col-md-4"><label>Status</label><select name="status" class="form-select"><option>On Track</option><option>At Risk</option><option>Delayed</option><option>Completed</option></select></div></div><button class="btn btn-primary mt-4">Create</button></form></div>{% endblock %}
